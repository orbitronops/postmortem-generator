[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitronops-postmortem-generator"
version = "0.1.0"
description = "Blameless postmortem generator from an incident timeline and triage findings — OrbitronOps demo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OrbitronOps", email = "hello@orbitronops.com" }]
keywords = ["sre", "incident", "postmortem", "blameless", "kubernetes", "on-call"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orbitronops-postmortem = "orbitronops_postmortem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
